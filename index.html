         alt="Guia rápido — Seu sorriso em movimento: orientações para usar seu Invisalign.
01 Uso: use de 20 a 22 horas por dia, conforme orientação. Retire para comer e beber; com os alinhadores na boca, beba apenas água. Troque no dia indicado pela sua ortodontista.
02 Cuidados e higiene: lave as mãos antes de colocar ou retirar o alinhador. Escove os dentes e use fio dental antes de recolocá-lo. Limpe o alinhador com escova macia, sabonete neutro ou detergente. Enxágue bastante em água corrente. 1 a 2 vezes por semana, use a caixa higienizadora com uma pastilha própria. Guarde na case; nunca enrole em guardanapo nem coloque no bolso.
Evite calor: não use água quente nem deixe o alinhador no carro ou exposto ao sol; o calor pode deformá-lo.
Dúvidas? Fale com sua ortodontista. Drª Marcella do Rio, Ortodontia.">
